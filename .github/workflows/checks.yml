name: Pull Request Checks

on: 
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs: 
    lint:
        name: Ruff Lint
        runs-on: ubuntu-latest


        steps: 
            - name: Download repository
              uses: actions/checkout@v4
              

            - name: Install Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Install Ruff
              run: python -m pip install ruff

            - name: Check python code
              run: ruff check .

    docs:
        name: Documentation Build
        runs-on: ubuntu-latest

        steps:

            - name: Download repository
              uses: actions/checkout@v4

            - name: install Doxygen and Graphviz
              run: 
                sudo apt-get update
                sudo apg-get install -y doxygen graphviz

            - name: Generate documentation
              run: doxygen Doxyfile

            - name: Check output
              run: test -f build/html/index.html