name: Build exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Convert environment.yml to UTF-8
        shell: pwsh
        run: |
          Get-Content environment.yml | Where-Object { $_ -notmatch '^prefix:' } | Set-Content -Encoding utf8 environment-utf8.yml

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment-utf8.yml
          activate-environment: FSAEDataGUI
          auto-activate: false

      - name: Build exe
        shell: bash -el {0}
        run: |
          conda activate FSAEDataGUI
          pip install pyinstaller
          pyinstaller --onefile --windowed --name uOpenFormula --add-data "Assets;Assets" main.py

      - uses: actions/upload-artifact@v4
        with:
          name: uOpenFormula-exe
          path: dist/uOpenFormula.exe
